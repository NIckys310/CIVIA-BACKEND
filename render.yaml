# Despliegue en Render: API + interfaz en un solo servicio Docker.
# PostgreSQL: crea una base (Render o Neon) y define DATABASE_URL en formato JDBC
# (jdbc:postgresql://host:5432/civia?sslmode=require).
services:
  - type: web
    name: civia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/status
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CIVIA_JWT_SECRET
        sync: false
      - key: CIVIA_DATA_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
