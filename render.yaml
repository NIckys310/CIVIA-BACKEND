# Despliegue en Render: API + interfaz en un servicio Docker.
# La base de datos es PostgreSQL en Neon (permanente); la de Render gratuita caduca a los 30 días.
# La interfaz pública vive en Vercel (civia-black.vercel.app) y reenvía /api a este servicio.
services:
  - type: web
    name: civia-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/status
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Cadena de conexión de Neon tal cual (postgresql://usuario:clave@host/civia?sslmode=require).
      # Se pega a mano en Render → Environment; nunca va al repositorio.
      - key: DATABASE_URL
        sync: false
      # 256 bits aleatorios en Base64, generados por Render. No cambiarlos después:
      # cerrarían las sesiones y los datos cifrados dejarían de leerse.
      - key: CIVIA_JWT_SECRET
        generateValue: true
      - key: CIVIA_DATA_KEY
        generateValue: true
      - key: CIVIA_PUBLIC_URL
        value: https://civia-black.vercel.app
      - key: CIVIA_CORS_ORIGINS
        value: https://civia-black.vercel.app
      # Clave de la API de Claude (console.anthropic.com). Sin ella, el Copilot usa el motor local.
      - key: ANTHROPIC_API_KEY
        sync: false
      # IA gratuita para el Copilot (console.groq.com → API Keys). Se pega a mano en Render.
      # Respaldo opcional: CEREBRAS_API_KEY y OPENROUTER_API_KEY. Sin ninguna, motor local.
      - key: GROQ_API_KEY
        sync: false
      - key: CIVIA_AI_EFFORT
        value: high
