# Despliegue en Render: API + interfaz en un servicio Docker y PostgreSQL administrado.
# Render crea la base y genera las claves; no hay que copiar credenciales a mano.
# La interfaz pública vive en Vercel (civia-black.vercel.app) y reenvía /api a este servicio.
databases:
  - name: civia-db
    plan: free
    databaseName: civia
    user: civia

services:
  - type: web
    name: civia-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/status
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: civia-db
          property: connectionString
      # 256 bits aleatorios en Base64, generados por Render. No cambiarlos después:
      # cerrarían las sesiones y los datos cifrados dejarían de leerse.
      - key: CIVIA_JWT_SECRET
        generateValue: true
      - key: CIVIA_DATA_KEY
        generateValue: true
      - key: CIVIA_PUBLIC_URL
        value: https://civia-black.vercel.app
      - key: CIVIA_CORS_ORIGINS
        value: https://civia-black.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
