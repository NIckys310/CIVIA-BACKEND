# Mantiene despierto el backend en Render.
# El plan gratuito de Render duerme el servicio tras 15 min sin tráfico y la siguiente visita
# tarda ~50 s en despertarlo. Esta consulta periódica evita esa espera. El plan gratuito incluye
# 750 h/mes por cuenta: alcanza para un servicio encendido todo el mes.
#
# Notas:
# - GitHub solo ejecuta los flujos programados desde la rama por defecto (main).
# - GitHub puede retrasar los flujos programados en horas de mucha carga; por eso cada 5 min.
# - En repositorios sin actividad durante 60 días GitHub pausa los flujos programados;
#   se reactivan desde la pestaña Actions o con cualquier push.
name: Mantener la API despierta

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Consultar /api/v1/status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CIVIA_API_STATUS_URL: https://civia-api-i71z.onrender.com/api/v1/status
    steps:
      - name: Despertar o mantener la API
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 "$CIVIA_API_STATUS_URL"
