# CI de CIVIA-BACKEND: secretos → compila CIVIA-IA → pruebas de la API (Java 21).
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API (Spring Boot, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Instalar la capa de IA (CIVIA-IA, misma rama si existe; si no, main)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/NIckys310/CIVIA-IA.git ../CIVIA-IA \
            || git clone --depth 1 https://github.com/NIckys310/CIVIA-IA.git ../CIVIA-IA
          (cd ../CIVIA-IA && ./mvnw -B -q install -DskipTests)
      - name: Pruebas (H2 en memoria, flujo completo de seguridad y API)
        run: ./mvnw -B verify

  image:
    name: Imagen Docker (la misma que despliega Render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir la imagen
        run: docker build -t civia-ci .
      - name: El archivo CDS se generó
        run: docker run --rm --entrypoint ls civia-ci -la /app/app.jsa
      - name: La API arranca y responde /api/v1/status
        run: |
          docker run -d --name civia -p 8080:8080 civia-ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/status; then echo; docker logs civia 2>&1 | grep -E "Started CiviaApplication"; exit 0; fi
            sleep 3
          done
          docker logs civia
          exit 1
