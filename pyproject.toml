# Workspace Python de CIVIA (gestionado con uv).
[tool.uv.workspace]
members = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y símbolos (Ø, ×) son válidos en textos es-CO

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
